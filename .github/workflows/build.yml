name: 三平台打包（绿色版 / 安装版 / 苹果版）

# 触发方式：
#   1) 手动：Actions 页 → 选本工作流 → Run workflow（推荐测试时用，避免每次 push 都烧额度）
#   2) 打 tag：git tag v1.0.0 && git push origin v1.0.0 → 自动构建并创建草稿 Release
#
# 额度说明：本仓库为公开开源仓库，GitHub 标准 runner 构建完全免费、不计分钟。
#   仅手动触发或打 tag 时构建，不绑定每次 push。
#   若改回私有仓库：GitHub Free 2000 分钟/月，倍率 Linux 1× / Windows 2× / macOS 10×，
#   一次三平台全构建约耗 ~70 计费分，约可跑 25-28 次。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows（安装版 + 绿色版）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Tauri（NSIS 安装版）
        run: npm run tauri build

      - name: 打包绿色版 zip（exe + 用户手册）
        shell: pwsh
        run: |
          $root = 'release/PDF工具箱-1.0.0-便携版'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item src-tauri/target/release/pdf-compress.exe $root
          Copy-Item docs/用户手册.md $root
          Compress-Archive -Path $root -DestinationPath release/PDF工具箱-1.0.0-便携版.zip -Force

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-and-portable
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            release/*便携版.zip
          retention-days: 7

  build-macos:
    name: macOS（dmg + app，Apple Silicon）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      # 未签名构建：产物可用，但首次打开会触发 Gatekeeper「已损坏/无法验证开发者」。
      # 临时打开方式：xattr -dr com.apple.quarantine /Applications/PDF\ Toolbox.app
      # 正式分发需 Apple Developer ID（$99/年）签名 + 公证，见审核报告「代码签名方案」。
      - name: 构建 Tauri（macOS .app + .dmg）
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles app,dmg

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-apple-silicon
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          retention-days: 7

  # 可选：如需 Intel Mac 版，取消本 job 注释（会额外消耗 macOS 10× 额度）
  # build-macos-intel:
  #   name: macOS（dmg + app，Intel）
  #   runs-on: macos-13
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with: { node-version: '20', cache: npm }
  #     - uses: dtolnay/rust-toolchain@stable
  #       with: { targets: x86_64-apple-darwin }
  #     - uses: Swatinem/rust-cache@v2
  #       with: { workspaces: src-tauri }
  #     - run: npm ci
  #     - run: npm run tauri build -- --target x86_64-apple-darwin --bundles app,dmg
  #     - uses: actions/upload-artifact@v4
  #       with:
  #         name: macos-intel
  #         path: |
  #           src-tauri/target/release/bundle/dmg/*.dmg
  #           src-tauri/target/release/bundle/macos/*.app
  #         retention-days: 7

  release:
    name: 创建草稿 Release（仅打 tag 时）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 发布草稿 Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
